version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # Writes to the terminal: there is nowhere to report a failure.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Read-only result sets; the query error is already checked.
        - (*database/sql.Rows).Close
    staticcheck:
      checks:
        - all
        # The staticcheck defaults.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error strings start with the proper noun "Telegram".
        - -ST1005
        # Quick-fix suggestions are style, not defects.
        - -QF*
  exclusions:
    rules:
      # Tests pass a nil context on purpose to cover nil guards.
      - path: _test\.go
        text: SA1012
      # Test setup and output helpers do not need error handling.
      - path: _test\.go
        linters:
          - errcheck
