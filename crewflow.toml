# crewflow settings for telecli. See https://github.com/naghuale/crewflow (docs/DESIGN.md §5).

[project]
repo = "naghuale/tele"
default_branch = "main"
language = "ru"

[identity]
# The executor works as the bot of the GitHub App crewflow-executor (§7i of the crewflow
# design): a token of an hour for this repository, pushes of the branch of its task only.
# The owner decided it on 2026-09-29.
mode = "bot"

[identity.github_app]
app_id = 5107052
installation_id = 165781718

[orchestrator]
# The orchestrator reviews and merges as its own subject, the bot of the GitHub App
# crewflow-orchestrator, and not as the owner's login: crewflow doctor shows
# owner == orchestrator: NO. The owner lifted the shared mode for telecli on 2026-10-02.
mode = "separate"

[orchestrator.github_app]
# The App crewflow-orchestrator, the same one crewflow itself merges under. The owner added
# naghuale/tele to the App on 2026-10-02; installation_id = 0 lets crewflow find the
# installation of the App for this repository, as it does in crewflow.
app_id = 5140522
installation_id = 0

[executor]
command = ["opencode", "run", "--dir", "{worktree}", "--format", "json", "{prompt}"]
timeout = "90m"

[access]
# The caches and the toolchain the executor may read outside the worktree.
read_from = [["go", "env", "GOMODCACHE"], ["go", "env", "GOROOT"]]
read = []

[worktrees]
root = "~/.crewflow/worktrees/{repo}"

[[gates]]
name = "format"
run = ["sh", "-c", "test -z \"$(gofmt -l .)\""]

[[gates]]
name = "vet"
run = ["go", "vet", "./..."]

[[gates]]
name = "test"
run = ["go", "test", "-race", "-count=1", "./..."]

[[gates]]
name = "lint"
run = ["golangci-lint", "run", "--timeout", "5m", "./..."]

[[gates]]
name = "tidy"
run = ["go", "mod", "tidy", "-diff"]

[ci]
required = true
timeout = "30m"

[merge]
# The orchestrator merges, ff-only. Its own bot is the reviewer whose approval crewflow
# waits for, the owner is the login that may merge by hand, and the executor never merges:
# crewflow names the role by the stable number of the subject before it presses the button.
by = "orchestrator"
strategy = "ff-only"
reviewers = ["crewflow-orchestrator[bot]"]
owners = ["naghuale"]

[parallel]
max_tasks = 1

[tasks]
owner_approval = "risky"

[acceptance]
# The label that goes with the owner's acceptance of a merge; acceptance itself is by SHA,
# ACCEPTED <sha> (AGENTS.md §3).
label = "owner-check"

[requirements]
tools = [
  { name = "go", check = ["go", "version"], min = "1.27" },
  { name = "golangci-lint", check = ["golangci-lint", "version"], min = "2.14" },
  { name = "libtdjson", check = ["sh", "-c", "test -e \"${TELECLI_TDLIB_LIBRARY:-$HOME/.local/lib/libtdjson.dylib}\""] },
]

[isolation]
mode = "host"
